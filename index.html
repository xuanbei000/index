<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>自我介紹</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #B3BEB0;
      color: #5D3A00;
      text-align: center;
      margin: 0;
      padding: 0;
    }

    .container {
      max-width: 600px;
      margin: 50px auto;
      padding: 20px;
      background-color: #E8E5DE;
      border-radius: 10px;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
    }

    .nav-buttons {
      display: flex;
      justify-content: center;
      gap: 15px;
      margin-bottom: 20px;
    }

    .nav-buttons .btn {
      padding: 12px 18px;
      background-color:#5A8693;
      color:#ecf0f1;
      border: none;
      border-radius: 5px;
      cursor: pointer;
      font-size: 16px;
      text-decoration: none;
      transition: background 0.3s;
    }

    .nav-buttons .btn:hover {
      background-color: #5A8693;
    }

    h1 {
      color: #111110;
      font-family: "ZCOOL KuaiLe", serif;
    }

    p {
      font-size: 18px;
      color: #0a0a0a;
      font-family: "ZCOOL KuaiLe", serif;
    }

    .main-btn {
      padding: 12px 22px;
      background-color:#5A8693;
      color: white;
      border: none;
      border-radius: 5px;
      cursor: pointer;
      font-size: 16px;
      margin-top: 20px;
      transition: background 0.3s;
    }

    .main-btn:hover {
      background-color:#5A8693;
    }
  </style>
</head>
<body>

  <div class="container">
    <div class="nav-buttons">
      <a href="index.html" class="btn">首頁</a>
      <a href="about.html" class="btn">關於我</a>
      <a href="research.html" class="btn">研究</a>
      <a href="homework.html" class="btn">作業</a>
    </div>

    <h1>Hi，歡迎來到自我介紹網站</h1>
    <p></p>
    <p></p>
    
    <button class="main-btn" id="introButton">點擊我</button>
    <p id="welcomeMessage"></p>
  </div>

  <script>
    document.getElementById("introButton").addEventListener("click", function() {
      document.getElementById("welcomeMessage").textContent = "歡迎 點進來沒意義的按鈕!!!";
    });
  </script>

</body>
</html>
